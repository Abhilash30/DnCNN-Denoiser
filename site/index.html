<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNN Image Denoiser</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
  figure { margin: 0; flex: 1 1 300px; }
  canvas { max-width: 100%; height: auto; border: 1px solid #8884; }
  figcaption { font-size: 0.9rem; opacity: 0.8; }
</style>
</head>
<body>

<h1>CNN Image Denoiser</h1>
<p>
  Runs entirely in your browser, so your image never leaves your device.
  Colour photos are converted to grayscale first, because the model was trained on grayscale images.
</p>

<input type="file" id="file" accept="image/*">
<p id="status">Loading model…</p>

<div class="row">
  <figure>
    <canvas id="inCanvas"></canvas>
    <figcaption>Input (grayscale)</figcaption>
  </figure>
  <figure>
    <canvas id="outCanvas"></canvas>
    <figcaption>Denoised</figcaption>
  </figure>
</div>

<p><a id="download" download="denoisedimage.png" hidden>Download result</a></p>

<script>
const MODEL_URL = "models/dncnn_sigma25.onnx";
const MAX_SIDE = 1024;  // longest side in pixels; larger images are resized to save memory

const statusEl = document.getElementById("status");
const fileInput = document.getElementById("file");
const inCanvas = document.getElementById("inCanvas");
const outCanvas = document.getElementById("outCanvas");
const download = document.getElementById("download");

// Load the model once, in the background.
fileInput.disabled = true;
const sessionPromise = ort.InferenceSession.create(MODEL_URL, { executionProviders: ["wasm"] });
sessionPromise
  .then(() => {
    statusEl.textContent = "Model ready. Choose an image.";
    fileInput.disabled = false;
  })
  .catch((e) => { statusEl.textContent = "Could not load model: " + e.message; });

// Draw the image onto the input canvas as grayscale and return it as a [0, 1] float array.
function toGrayscale(bitmap) {
  const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale);
  const h = Math.round(bitmap.height * scale);

  inCanvas.width = w;
  inCanvas.height = h;
  const ctx = inCanvas.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff";           // transparent PNG pixels become white, not black
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(bitmap, 0, 0, w, h);

  const rgba = ctx.getImageData(0, 0, w, h);
  const d = rgba.data;
  const gray = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const y = Math.round(0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2]);
    gray[i] = y / 255;
    d[4 * i] = d[4 * i + 1] = d[4 * i + 2] = y;   // show the grayscale version on screen
  }
  ctx.putImageData(rgba, 0, 0);
  return { gray, w, h, resized: scale < 1 };
}

// Turn the model's output back into a picture.
function drawOutput(out, w, h) {
  outCanvas.width = w;
  outCanvas.height = h;
  const ctx = outCanvas.getContext("2d");
  const img = ctx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    const v = Math.round(Math.min(1, Math.max(0, out[i])) * 255);
    img.data[4 * i] = img.data[4 * i + 1] = img.data[4 * i + 2] = v;
    img.data[4 * i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  outCanvas.toBlob((blob) => {
    download.href = URL.createObjectURL(blob);
    download.hidden = false;
  });
}

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;
  download.hidden = true;

  let bitmap;
  try {
    bitmap = await createImageBitmap(file);
  } catch {
    statusEl.textContent = "Your browser can't read this image format. Try a JPG or PNG.";
    return;
  }

  const { gray, w, h, resized } = toGrayscale(bitmap);
  statusEl.textContent = "Denoising…";
  await new Promise((r) => requestAnimationFrame(() => setTimeout(r)));  // let the page repaint first

  try {
    const session = await sessionPromise;
    const t0 = performance.now();
    const result = await session.run({ noisy: new ort.Tensor("float32", gray, [1, 1, h, w]) });
    drawOutput(result.denoised.data, w, h);
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    statusEl.textContent = `Done in ${secs}s (${w}×${h}).` +
      (resized ? ` The image was larger than ${MAX_SIDE}px and was resized.` : "");
  } catch (e) {
    statusEl.textContent = "Denoising failed: " + e.message;
  }
});
</script>
</body>
</html>
